# @package _global_

# to execute this experiment run:
# python src/train.py experiment=merlin

defaults:
  - override /data: tsx_ssc.yaml
  - override /model: merlin.yaml
  - override /callbacks: tsx_ddc.yaml
  - override /logger: wandb.yaml
  - override /trainer: gpu.yaml
  - override /hydra: default.yaml

data:
  # hdf5_dir: ${paths.data_dir}processed_hdf5/TSX_preprocessed_spatial_splits_5_256x256
  batch_size: 12 # MERLIN uses 12
  num_workers: 11

model:
  optimizer:
    # About the learning rate: it's EXTREMELY sensible. Check sweep from September 12th, 2025 to see boundaries:
    #  - 5e-4 is too high (diverges and recinstructs NaNs)
    #  - 1e-4 is ok
    #  - 1e-5 is ok
    #  - 1e-6 is too low (starts seeing some instability)
    # If the training diverges, first thing: lower the lr. Also @TODO, see how the batch_size affects this.
    lr: 1e-4

callbacks:
  compare_recon_to_gt:
    patch_dir: ${paths.data_dir}
    # split_large_patch: True
    # blend_method: "count"
    # stride: ${data.patch_size}

trainer:
  min_epochs: 1
  max_epochs: 30
  deterministic: True
  detect_anomaly: True
  log_every_n_steps: 10

logger:
  wandb:
    project: "sar-ddc-test"
    offline: False
    # tags: ${tags}
    # name: ${name}

# The task name determines the logs path, by convention use <task>/<dataset>/<model>
task_name: train/sar_ddc/merlin
tags: ["TSX_SSC", "Merlin"]
seed: 42
