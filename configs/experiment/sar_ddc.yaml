# @package _global_

# to execute this experiment run:
# python src/train.py experiment=sar_ddc

defaults:
  - override /data: tsx_ssc.yaml
  - override /model: sar_hyperprior.yaml
  - override /callbacks: tsx_ddc.yaml
  - override /logger: wandb.yaml
  - override /trainer: gpu.yaml
  - override /hydra: default.yaml

data:
  hdf5_dir: ${paths.data_dir}processed_hdf5/spatialsplit5_nopres_normMERLINnat
  log_mode: "natural"
  must_normalize: null # 0 <=> true min-max, 1 <=> min-max with 1% and 99% percentiles, etc.
  batch_size: 16
  num_workers: 11

model:
  criterion:
    metric: "merlin" # "mse" or "ssim" or "ms_ssim"
    lmbda: 0.1

callbacks:
  log_val_patch:
    patch_dir: ${data.hdf5_dir}
  log_val_batch_plot:
    log_every_n_epochs: 1
    num_images: 3
    add_residuals: True
  early_stopping:
    verbose: True

trainer:
  min_epochs: 1
  max_epochs: 10

logger:
  wandb:
    project: "sar-ddc-test"
    offline: False
    # tags: ${tags}
    # name: ${name}

# The task name determines the logs path, by convention use <task>/<dataset>/<model>
task_name: train/sar_ddc/hyperprior
tags: ["TSX_SSC", "hyperprior"]
seed: 42
# Flatten the lmbda value because W&B custom chart expressions do not support nested dicts
lambda: ${model.criterion.lmbda}