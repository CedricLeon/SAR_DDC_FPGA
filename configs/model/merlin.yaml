_target_: src.models.merlin_module.MerlinModule

net:
  _target_: src.models.components.U-net.MerlinUNet
  nb_in: 1
  nb_out: 1

criterion:
  _target_: src.utils.metrics.MerlinLoss

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  betas: [0.9, 0.99]
  eps: 1e-8
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.MultiStepLR
  _partial_: true
  milestones: [4, 20]  # Reduce LR at epochs 4 and 20
  gamma: 0.1           # Multiply LR by 0.1 at each milestone

gradient_clip_norm: 1.0
