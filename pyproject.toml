[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 99 # consistent with Black settings in pre-commit-config.yaml

[tool.ruff.lint]
unfixable = ["F401"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
# Pin first-party packages so import grouping is deterministic across machines and CI.
# Without this, isort infers first-party from the filesystem and can group `src`/`context`
# differently on the GitHub runner than locally (the "passes locally, fails in CI" case).
profile = "black"
known_first_party = ["src", "context"]
