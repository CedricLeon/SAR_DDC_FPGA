# SHyp (no residual blocks) — lr-tuned retrain at lr=5e-4.
#
# 60 runs: 6 seeds × 10 lambda. Tagged "lr_5e-4" (same convention as FP/ResFP).
# The ScaleHyperprior target + no_residual_blocks=True select SH only and exclude
# FP/ResFP (which also carry the lr_5e-4 tag).
#
# Usage:
#   python scripts/fpga/deploy/batch_deploy.py --config scripts/fpga/deploy/batch_deploy_configs/SHyp_lr5e4.yaml --tag lr_5e-4

description: "SHyp — lr=5e-4 retrain (60 models)"

filters:
  - field: run.tags
    op: contains
    value: lr_5e-4

  - field: model.net._target_
    op: contains
    value: ScaleHyperprior

  - field: model.net.no_residual_blocks
    op: "=="
    value: true

  - field: model.net_optimizer.lr
    op: "=="
    value: 0.0005  # NOT 5e-4 — PyYAML parses 5e-4 as a string, which breaks the == numeric match

  - field: model.net.no_output_padding
    op: "=="
    value: true

  - field: seed
    op: "in"
    value: [0, 1, 2, 3, 4, 5]

  - field: model.criterion.lmbda
    op: "in"
    value: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]
